- from: bot
  text: |-
    Following TalentLMS, Docebo and Moodle — from my knowledge of the LMS
    category. They all agree on Courses, content Units, Enrollments, Assessments
    and Certificates, and that agreement is the outline below.

    The mechanism your goal turns on is enrollment-to-proof: an Enrollment
    tracks a learner from assigned to completed, and a Certificate is issued as
    the audit-ready completion record. I deliberately keep grades/badges out —
    completion plus assessment pass covers proof without enterprise extras.

    Confirm the entity list for your Learning Management System:

    * Courses: training offerings the workforce must take; the catalog
      everything else hangs off
    * Lessons: content steps inside a Course; each belongs to a Course
    * Enrollments: a learner assigned to a Course; each belongs to a Course and
      names a learner in Users
    * Assessments: checks that prove learning for a Course; each belongs to a
      Course
    * Certificates: audit-ready proof of completion; each belongs to an
      Enrollment
    * Users: existing, platform users; Enrollments name a learner, Courses name
      an instructor

    How should I design the Learning Management System?

    A. With all 5: Courses, Lessons, Enrollments, Assessments, Certificates
    (recommended).

    B. With the core 4: Courses, Lessons, Enrollments, Certificates —
    Assessments as a follow-up.

    Reply with A or B, or tell me what to add, drop or rename.
