- from: bot
  text: |-
    Built the Work Management module with Teams, Work Requests, Projects, Tasks
    and Goals, wired request → work → goal with progress rollups.

    https://tests.semantius.app/work-management

    **Access: advanced.** No step is restricted to a role. Role names start with
    "Work Management".

    | Role | Does | Sees |
    |---|---|---|
    | Viewer | reads only | everything |
    | Manager | the everyday work | everything |
    | Admin | the everyday work | everything |

    **No restricted step** on Work Requests, Projects, Tasks or Goals: anyone
    who can edit one can move it through every state.

    Next steps: add your first team and goal, create a project with its tasks,
    or import existing work from a CSV.

    Should I add a small demo dataset so you can review the module, or leave the
    tables empty for your real data?

    A. Sample data (recommended): 45 records across 5 tables (Teams, Work
    Requests, Projects, Tasks, Goals).

    B. Empty tables: nothing is seeded.

    Reply with A or B.
