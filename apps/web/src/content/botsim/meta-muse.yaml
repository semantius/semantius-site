- from: bot
  text: |-
    Modeled on Asana, Monday.com and ClickUp, from my knowledge of the category.
    What they agree on is Teams owning Projects that break into Tasks, with
    intake triaged into work and Goals tracking outcomes — the mechanism here is
    the request → work → goal chain, where every Task can trace back to its
    Request and contribute to a Goal, plus subtasks kept in the one Tasks table.
    One deliberate difference: a single Tasks entity covers both tasks and
    subtasks instead of separate tables.

    - Teams: squads that own the work; each has a lead (Users, existing).
    - Work Requests: intake triaged into real work; each is requested by a User
      and routed to a Team, then converted to a Project or Task.
    - Projects: containers of work toward an outcome; each belongs to a Team and
      can track a Goal.
    - Tasks: the units of work, including subtasks; each belongs to a Project,
      is assigned to a User, and can link back to its Request and forward to a
      Goal.
    - Goals: objectives the work ladders up to; each is owned by a Team, with
      Tasks contributing to it.
    - Users: existing, in the platform; referenced as requesters, assignees,
      leads and owners (view only).

    How should I design the Work Management?

    A. With all 5: Teams, Work Requests, Projects, Tasks, Goals (recommended).

    B. With the core 4: Work Requests, Projects, Tasks, Goals (Teams becomes a
    next step; assignment goes directly to users).

    Reply with A or B, or tell me what to add, drop or rename.
